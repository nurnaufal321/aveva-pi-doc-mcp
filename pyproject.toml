[project]
name = "pi-doc-mcp"
version = "0.1.0"
description = "MCP server for AVEVA PI System documentation"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
pi-doc-mcp = "server:main"
